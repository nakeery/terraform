# Rejects any pod that runs privileged, or shares the host's network/
# PID/IPC namespace. Any of these effectively breaks container
# isolation - a privileged container can access host devices directly,
# hostNetwork/hostPID/hostIPC let a container see (and potentially
# interact with) the node's own processes and network stack, not just
# its own.
#
# validationFailureAction is set to Audit here deliberately, not
# Enforce - see this file's own README for why: test against both
# range-01-eks-secure-baseline and range-02-eks-attack-chain in Audit mode first, confirm the
# policy actually catches what you expect it to catch on each side,
# THEN flip to Enforce. Enforcing an untested policy against a live
# cluster is how you accidentally lock yourself out of your own
# deployments.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-and-host-namespaces
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"

    - name: no-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Sharing the host network, PID, or IPC namespace is not allowed."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
