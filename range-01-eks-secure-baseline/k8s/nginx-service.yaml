# =====================================================================
# REFERENCE ONLY - not applied by hand anymore.
# This Service is now deployed by terraform/k8s.tf (hashicorp/kubernetes
# provider) so `terraform destroy` deletes it - and the backing AWS NLB - in
# dependency order instead of orphaning the load balancer. Kept here as a
# readable manifest and for the range-02 diff. Do NOT `kubectl apply` it
# alongside Terraform - that would create duplicate/conflicting objects.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  annotations:
    # Creates a Network Load Balancer (cheaper and simpler than
    # the classic Elastic LB). Requires the AWS Load Balancer
    # Controller for full ALB features; the default in-tree
    # provisioner is enough for this NLB.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
