# Codifies exactly the securityContext fields eks_phase_1's own
# nginx-deployment.yaml already hand-writes: runAsNonRoot and
# readOnlyRootFilesystem. Right now those protections only exist
# because someone typed them correctly into one file - this policy
# makes them a structural guarantee across every manifest, including
# ones written by a future you who forgot.
#
# Should PASS cleanly against eks_phase_1/k8s/nginx-deployment.yaml.
# Should FAIL against eks_vuln_range/k8s/vulnerable-dashboard.yaml,
# which sets no securityContext at all.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-nonroot-and-readonly-fs
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: "true"

    - name: require-readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must set securityContext.readOnlyRootFilesystem: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: "true"
