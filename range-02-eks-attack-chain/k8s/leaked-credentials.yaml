# ATTACK CHAIN STEP 5 - PLAINTEXT SECRETS IN A CONFIGMAP
#
# A ConfigMap's contents are NOT encrypted at rest by default and are
# readable by anyone with get/list access on ConfigMaps in this
# namespace - a much lower bar than the RBAC usually required to read
# Secrets. Storing anything credential-shaped here, instead of in a
# Secret (and ideally in something like AWS Secrets Manager pulled in
# at runtime), is the mistake this file demonstrates.
#
# The value below is a fake, non-functional placeholder - never put a
# real credential in a file like this, even a throwaway training-range
# one that gets destroyed same-session.
apiVersion: v1
kind: ConfigMap
metadata:
  name: leaked-credentials
data:
  AWS_ACCESS_KEY_ID: "AKIAFAKEEXAMPLE0000"
  AWS_SECRET_ACCESS_KEY: "this-is-a-placeholder-not-a-real-credential"
  DB_PASSWORD: "hunter2-placeholder-not-real"
